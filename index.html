<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学习打卡">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>学习打卡</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--sub:#86868b;--line:#e5e5ea;
--c0:#b87a74;--c1:#6f88b3;--c2:#c4a574;--c3:#7fa68c;--acc:#3a3a3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"PingFang SC",sans-serif;
padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
.page{display:none;padding:14px}.page.on{display:block}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:15px;color:var(--sub);font-weight:500}
.big{font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbtn{border:0;border-radius:12px;color:#fff;font-size:20px;font-weight:600;padding:18px 0}
.sbtn small{display:block;font-size:12px;font-weight:400;opacity:.9}
.stop{width:100%;border:0;border-radius:12px;background:#1d1d1f;color:#fff;font-size:18px;padding:14px;margin-top:10px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(255,255,255,.95);border-top:1px solid var(--line);
padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:12px 0;font-size:15px;color:var(--sub)}
.tabs button.on{color:var(--tx);font-weight:600}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:14px;right:14px;background:#1d1d1f;color:#fff;border-radius:12px;padding:12px 14px;z-index:9;display:none}
.goal{display:flex;align-items:center;gap:8px;margin:6px 0}
.goal input{width:70px}
.prog{height:8px;border-radius:4px;background:#f2f2f7;overflow:hidden;margin:4px 0 10px}
.prog i{display:block;height:100%;background:var(--tx)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--sub)}
.d{border-radius:10px;padding:6px 0;min-height:52px;font-size:14px;background:#f2f2f7}
.d small{display:block;font-size:11px;color:var(--sub)}
.d.has{background:var(--k1)}.d.has2{background:var(--k2)}.d.has3{background:var(--k3);color:var(--kt)}.d.has3 small{color:var(--kt)}
.sw{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border:0}.sw i{width:28px;height:28px;border-radius:50%;display:block}.sw span{flex:1}
#pk{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20}
#pk .box{background:#fff;border-radius:16px;padding:16px;width:290px;text-align:center}
#ring{position:relative;width:220px;height:220px;margin:8px auto;border-radius:50%;touch-action:none;
background:conic-gradient(from 0deg,hsl(0,70%,55%),hsl(60,70%,55%),hsl(120,70%,55%),hsl(180,70%,55%),hsl(240,70%,55%),hsl(300,70%,55%),hsl(360,70%,55%));
-webkit-mask:radial-gradient(circle,transparent 62px,#000 63px);mask:radial-gradient(circle,transparent 62px,#000 63px)}
#knob{position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.6);margin:-11px 0 0 -11px;pointer-events:none}
#prev{width:80px;height:80px;border-radius:50%;position:absolute;left:70px;top:70px}
#pk input[type=range]{width:100%;padding:0;border:0}
.d.today{outline:2px solid var(--acc)}.d.sel{outline:2px solid #1d1d1f}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.nav button{border:0;background:#f2f2f7;border-radius:8px;padding:6px 14px;font-size:18px}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.dot{width:10px;height:10px;border-radius:50%}
.row .t{flex:1}.row .x{border:0;background:none;color:var(--c0);font-size:14px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.bar .n{width:40px}.bar .b{flex:1;background:#f2f2f7;border-radius:6px;height:16px;display:flex;overflow:hidden}
.bar .v{width:64px;text-align:right;font-variant-numeric:tabular-nums}
.btn{border:0;background:#f2f2f7;border-radius:10px;padding:10px 14px;font-size:15px;margin:4px 6px 4px 0}
select,input{font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
</style>
</head>
<body>
<div id="toast"></div>
<div id="pk"><div class="box"><b id="pkt"></b>
  <div style="position:relative"><div id="ring"><div id="knob"></div></div><div id="prev"></div></div>
  <div style="text-align:left;font-size:13px;color:var(--sub)">饱和度<input id="pks" type="range" min="0" max="100"></div>
  <div style="text-align:left;font-size:13px;color:var(--sub)">明暗<input id="pkl" type="range" min="20" max="85"></div>
  <div style="text-align:left;font-size:13px;color:var(--sub);margin:6px 0">色号 <input id="pkh" maxlength="7" placeholder="#b87a74" style="width:110px" onchange="pkHex(this.value)"></div>
  <button class="btn" onclick="pkReset()">恢复默认</button><button class="btn" onclick="pkClose()">完成</button></div></div>
<div class="page on" id="p-today"></div>
<div class="page" id="p-cal"></div>
<div class="page" id="p-week"></div>
<div class="tabs">
  <button data-p="today" class="on">打卡</button>
  <button data-p="cal">日历</button>
  <button data-p="week">统计</button>
</div>
<script>
const SUBJ=['政治','英语','数学','控制'], COL=['var(--c0)','var(--c1)','var(--c2)','var(--c3)'];
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
// ---- 颜色设置（色环）----
const DEF={c:[[5,32,59],[218,31,57],[37,40,61],[140,18,57]],cal:[220,20,58]};
let colors=load('study.colors',null)||JSON.parse(JSON.stringify(DEF));
const hsl=a=>`hsl(${a[0]},${a[1]}%,${a[2]}%)`;
function applyColors(){
  const r=document.documentElement.style;
  colors.c.forEach((a,i)=>r.setProperty('--c'+i,hsl(a)));
  const [h,s,l]=colors.cal;
  r.setProperty('--k1',`hsla(${h},${s}%,${l}%,.25)`);r.setProperty('--k2',`hsla(${h},${s}%,${l}%,.55)`);
  r.setProperty('--k3',hsl(colors.cal));r.setProperty('--kt',l>65?'#1d1d1f':'#fff');
  localStorage.setItem('study.colors',JSON.stringify(colors));
}
let pkT=null; // 'c0'..'c3' 或 'cal'
const pkGet=()=>pkT==='cal'?colors.cal:colors.c[+pkT[1]];
function hsl2hex(h,s,l){s/=100;l/=100;const f=n=>{const k=(n+h/30)%12,a=s*Math.min(l,1-l);
  return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}
function pkHex(v){
  let m=/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(v.trim()); if(!m) return alert('请输入色号，如 #b87a74');
  let x=m[1]; if(x.length===3) x=x.replace(/./g,'$&$&');
  const r=parseInt(x.slice(0,2),16)/255,g=parseInt(x.slice(2,4),16)/255,b=parseInt(x.slice(4),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  let h=0,s=0; if(d){ s=d/(1-Math.abs(2*l-1));
    h=mx===r?((g-b)/d+6)%6:mx===g?(b-r)/d+2:(r-g)/d+4; h*=60; }
  const a=pkGet(); a[0]=Math.round(h);a[1]=Math.round(s*100);a[2]=Math.round(l*100); pkShow();
}
function pkShow(){
  const a=pkGet(), R=88, rad=(a[0]-90)*Math.PI/180;
  document.getElementById('pkh').value=hsl2hex(a[0],a[1],a[2]);
  const k=document.getElementById('knob'); k.style.left=(110+R*Math.cos(rad))+'px'; k.style.top=(110+R*Math.sin(rad))+'px';
  document.getElementById('prev').style.background=hsl(a);
  document.getElementById('pks').value=a[1]; document.getElementById('pkl').value=a[2];
  applyColors();
}
function pkOpen(t){ pkT=t; document.getElementById('pkt').textContent=t==='cal'?'日历"已学"颜色':SUBJ[+t[1]]+'按钮颜色';
  document.getElementById('pk').style.display='flex'; pkShow(); }
function pkClose(){ document.getElementById('pk').style.display='none'; render(); }
function pkReset(){ const d=pkT==='cal'?DEF.cal:DEF.c[+pkT[1]]; pkGet().splice(0,3,...d); pkShow(); }
(()=>{
  const ring=document.getElementById('ring');
  const mv=e=>{const b=ring.getBoundingClientRect();
    pkGet()[0]=Math.round((Math.atan2(e.clientY-b.top-110,e.clientX-b.left-110)*180/Math.PI+90+360)%360); pkShow();};
  ring.addEventListener('pointerdown',e=>{ring.setPointerCapture(e.pointerId);mv(e)});
  ring.addEventListener('pointermove',e=>{if(ring.hasPointerCapture(e.pointerId))mv(e)});
  document.getElementById('pks').oninput=e=>{pkGet()[1]=+e.target.value;pkShow()};
  document.getElementById('pkl').oninput=e=>{pkGet()[2]=+e.target.value;pkShow()};
})();
applyColors();
const K='study.sessions', KR='study.running';
let sessions=load(K,[]);          // {id,s:科目序号,start:ms,end:ms}
let running=load(KR,null);        // {s,start}，进行中的打卡，退出App也不丢
const save=()=>{localStorage.setItem(K,JSON.stringify(sessions));localStorage.setItem(KR,JSON.stringify(running))};
const pad=n=>String(n).padStart(2,'0');
const dkey=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const hm=t=>{const d=new Date(t);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmt=ms=>{const m=Math.round(ms/60000);return m<60?`${m}分`:`${Math.floor(m/60)}时${pad(m%60)}分`};
const clock=ms=>{const s=Math.floor(ms/1000);return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`};
const dur=x=>x.end-x.start;
const byDay=k=>sessions.filter(x=>dkey(x.start)===k);
const sum=a=>a.reduce((n,x)=>n+dur(x),0);
let calMonth=new Date(); calMonth.setDate(1);
let selDay=dkey(Date.now());

// ---- 目标与提醒 ----
const H=3600000;
let goals=load('study.goals',{day:4,week:28});   // 小时，0 表示关闭
let notified=load('study.notified',{});
const weekStart=()=>{const n=new Date();n.setHours(0,0,0,0);n.setDate(n.getDate()-((n.getDay()+6)%7));return n};
const runMs=()=>running?Date.now()-running.start:0;
const todayTotal=()=>sum(byDay(dkey(Date.now())))+runMs();
const weekTotal=()=>{const ws=weekStart().getTime();return sum(sessions.filter(x=>x.start>=ws))+runMs()};
function notify(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  setTimeout(()=>{t.style.display='none'},8000);
  if('Notification' in window && Notification.permission==='granted' && navigator.serviceWorker)
    navigator.serviceWorker.ready.then(r=>r.showNotification('学习打卡',{body:msg})).catch(()=>{});
}
function checkGoals(){
  const dk='d'+dkey(Date.now()), wk='w'+dkey(weekStart());
  if(goals.day>0 && todayTotal()>=goals.day*H && !notified[dk]){
    notified[dk]=1; localStorage.setItem('study.notified',JSON.stringify(notified)); notify(`今日目标 ${goals.day} 小时已完成`);
  }
  if(goals.week>0 && weekTotal()>=goals.week*H && !notified[wk]){
    notified[wk]=1; localStorage.setItem('study.notified',JSON.stringify(notified)); notify(`本周目标 ${goals.week} 小时已完成`);
  }
}
function setGoal(k,v){ goals[k]=Math.max(0,+v||0); localStorage.setItem('study.goals',JSON.stringify(goals)); render(); checkGoals(); }
function askNotify(){
  if(!('Notification' in window)) return alert('当前环境不支持系统通知。请先用 Safari 把本页添加到主屏幕，再从主屏幕图标打开。');
  Notification.requestPermission().then(p=>{ alert(p==='granted'?'已开启系统通知':'未开启，仍会在打开 App 时弹出页面内提示'); render(); });
}
function prog(label,cur,goal){
  if(!goal) return '';
  return `<div style="display:flex;justify-content:space-between;font-size:14px"><span>${label}</span><span>${fmt(cur)} / ${goal}小时</span></div>
  <div class="prog"><i style="width:${Math.min(100,cur/(goal*H)*100)}%"></i></div>`;
}

function start(s){ if(running)return; running={s,start:Date.now()}; save(); render(); }
function stop(){
  if(!running)return;
  const end=Date.now();
  if(end-running.start>=1000) sessions.push({id:end,s:running.s,start:running.start,end});
  running=null; save(); render(); checkGoals();
}
function del(id){ if(confirm('删除这条记录？')){sessions=sessions.filter(x=>x.id!==id);save();render();} }
function addManual(){
  const s=+document.getElementById('ms').value, m=+document.getElementById('mm').value;
  if(!m||m<=0)return alert('请输入分钟数');
  const [y,mo,d]=selDay.split('-').map(Number);
  const st=new Date(y,mo-1,d,12,0).getTime();
  sessions.push({id:Date.now(),s,start:st,end:st+m*60000}); save(); render();
}

function list(arr,canDel){
  if(!arr.length)return '<div style="color:var(--sub)">暂无记录</div>';
  return arr.sort((a,b)=>a.start-b.start).map(x=>`<div class="row"><span class="dot" style="background:${COL[x.s]}"></span>
  <span class="t">${SUBJ[x.s]} ${hm(x.start)}–${hm(x.end)}</span><b>${fmt(dur(x))}</b>
  ${canDel?`<button class="x" onclick="del(${x.id})">删除</button>`:''}</div>`).join('');
}

function renderToday(){
  const k=dkey(Date.now()), td=byDay(k);
  let h='';
  if(running){
    h+=`<div class="card"><h2>正在学习：${SUBJ[running.s]}（${hm(running.start)} 开始）</h2>
    <div class="big" id="tick">${clock(Date.now()-running.start)}</div>
    <button class="stop" onclick="stop()">学完了 · 打卡结束</button></div>`;
  } else {
    h+=`<div class="card"><h2>选择科目，开始学习打卡</h2><div class="grid">`+
      SUBJ.map((n,i)=>`<button class="sbtn" style="background:${COL[i]}" onclick="start(${i})">${n}
      <small>今日 ${fmt(sum(td.filter(x=>x.s===i)))}</small></button>`).join('')+`</div></div>`;
  }
  h+=`<div class="card"><h2>今日已学</h2><div class="big" style="font-size:32px">${fmt(todayTotal())}</div>
  <div style="margin-top:10px">${prog('今日目标',todayTotal(),goals.day)}${prog('本周目标',weekTotal(),goals.week)}</div></div>
  <div class="card"><h2>今日记录</h2>${list(td,true)}</div>`;
  document.getElementById('p-today').innerHTML=h;
}

function renderCal(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate(), off=(first.getDay()+6)%7;
  let h=`<div class="card"><div class="nav"><button onclick="mv(-1)">‹</button><b>${y}年${m+1}月</b><button onclick="mv(1)">›</button></div><div class="cal">`+
    '一二三四五六日'.split('').map(c=>`<div class="h">${c}</div>`).join('')+'<div></div>'.repeat(off);
  let mt=0;
  for(let d=1;d<=days;d++){
    const k=`${y}-${pad(m+1)}-${pad(d)}`, t=sum(byDay(k)); mt+=t;
    const hrs=t/3600000, cls=hrs>=4?'has3':hrs>=2?'has2':t>0?'has':'';
    h+=`<div class="d ${cls} ${k===dkey(Date.now())?'today':''} ${k===selDay?'sel':''}" onclick="selDay='${k}';render()">${d}<small>${t?fmt(t):''}</small></div>`;
  }
  h+=`</div><div style="margin-top:8px;color:var(--sub);font-size:14px">本月累计 ${fmt(mt)}</div></div>`;
  const ds=byDay(selDay);
  h+=`<div class="card"><h2>${selDay} · 共 ${fmt(sum(ds))}</h2>${list(ds,true)}
  <div style="margin-top:10px"><h2>补录（忘记打卡时）</h2><select id="ms">${SUBJ.map((n,i)=>`<option value="${i}">${n}</option>`).join('')}</select>
  <input id="mm" type="number" inputmode="numeric" placeholder="分钟" style="width:80px">
  <button class="btn" onclick="addManual()">添加</button></div></div>`;
  document.getElementById('p-cal').innerHTML=h;
}
function mv(n){calMonth.setMonth(calMonth.getMonth()+n);render()}

let weekOff=0;
function renderWeek(){
  const now=new Date(); now.setHours(0,0,0,0);
  const mon=new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7)+weekOff*7);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d});
  const per=days.map(d=>{const a=byDay(dkey(d));return {d,a,t:sum(a)}});
  const total=per.reduce((n,x)=>n+x.t,0), max=Math.max(...per.map(x=>x.t),1);
  const subj=SUBJ.map((_,i)=>per.reduce((n,x)=>n+sum(x.a.filter(y=>y.s===i)),0));
  const label=`${dkey(days[0]).slice(5)} ~ ${dkey(days[6]).slice(5)}`;
  let h=`<div class="card"><div class="nav"><button onclick="weekOff--;render()">‹</button><b>${weekOff===0?'本周':label}</b><button onclick="weekOff++;render()">›</button></div>
  <div style="text-align:center;color:var(--sub)">${label}</div><div class="big">${fmt(total)}</div>
  <div style="text-align:center;color:var(--sub);font-size:14px">日均 ${fmt(total/7)}</div></div>
  <div class="card"><h2>每天</h2>`+per.map((x,i)=>`<div class="bar"><span class="n">周${'一二三四五六日'[i]}</span>
  <span class="b">${SUBJ.map((_,j)=>{const t=sum(x.a.filter(y=>y.s===j));return `<i style="width:${t/max*100}%;background:${COL[j]}"></i>`}).join('')}</span>
  <span class="v">${x.t?fmt(x.t):'-'}</span></div>`).join('')+`</div>
  <div class="card"><h2>各科目</h2>`+subj.map((t,i)=>`<div class="bar"><span class="n">${SUBJ[i]}</span>
  <span class="b"><i style="width:${t/Math.max(...subj,1)*100}%;background:${COL[i]}"></i></span><span class="v">${fmt(t)}</span></div>`).join('')+`</div>
  <div class="card"><h2>学习目标与提醒</h2>
  <div class="goal">每天目标 <input type="number" inputmode="decimal" step="0.5" min="0" value="${goals.day}" onchange="setGoal('day',this.value)"> 小时</div>
  <div class="goal">每周目标 <input type="number" inputmode="decimal" step="0.5" min="0" value="${goals.week}" onchange="setGoal('week',this.value)"> 小时</div>
  <div style="color:var(--sub);font-size:13px">填 0 表示不设目标。达到目标时会弹出提示。</div>
  <button class="btn" onclick="askNotify()">${'Notification' in window&&Notification.permission==='granted'?'系统通知：已开启':'开启系统通知'}</button></div>
  <div class="card"><h2>颜色设置（点击后在色环上选）</h2>`+
  SUBJ.map((n,i)=>`<div class="sw" onclick="pkOpen('c${i}')"><i style="background:var(--c${i})"></i><span>${n}按钮</span>›</div>`).join('')+
  `<div class="sw" onclick="pkOpen('cal')"><i style="background:var(--k3)"></i><span>日历"已学"的天</span>›</div></div>
  <div class="card"><h2>数据备份</h2><button class="btn" onclick="exp()">导出</button>
  <button class="btn" onclick="document.getElementById('imp').click()">导入</button>
  <input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])">
  <div style="color:var(--sub);font-size:13px">数据只存在这部手机里，清理 Safari 数据会丢失，建议定期导出。</div></div>`;
  document.getElementById('p-week').innerHTML=h;
}
function exp(){
  const b=new Blob([JSON.stringify(sessions)],{type:'application/json'}), a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=`study-${dkey(Date.now())}.json`; a.click();
}
function imp(f){
  if(!f)return; f.text().then(t=>{try{const d=JSON.parse(t); if(!Array.isArray(d))throw 0;
    if(confirm(`导入 ${d.length} 条记录，将覆盖现有数据？`)){sessions=d;save();render();}}catch(e){alert('文件格式不对')}});
}

let page='today';
function render(){ renderToday(); renderCal(); renderWeek();
  document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id==='p-'+page));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===page)); }
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{page=b.dataset.p;render()});
setInterval(()=>{ if(running){ if(page==='today'){const t=document.getElementById('tick'); if(t)t.textContent=clock(Date.now()-running.start);} checkGoals(); } },1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();checkGoals();}});
render(); checkGoals();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
